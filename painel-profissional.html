for(const action of ['Projeto/Criar','Projeto/Editar'])CC.handlers[action]=async function(f){const user=CC.require('Aluno');if(!user.PossuiFormacao)throw new Error('Projetos estão disponíveis para perfis com formação. Cadastre serviços no seu perfil.');const id=Number(f.get('id')||CC.query().id),record={Titulo:f.get('Titulo'),Descricao:f.get('Descricao'),Tipo:f.get('Tipo'),Tecnologias:f.get('Tecnologias'),Area:CC.db().areas.find(a=>a.Id===user.AreaId)?.Nome||'Interdisciplinar',DadosDinamicos:{},Links:[]};if(!record.Titulo||!CC.strip(record.Descricao).trim())throw new Error('Título e descrição são obrigatórios.');if(record.Titulo.length>150||record.Descricao.length>2000)throw new Error('Use até 150 caracteres no título e 2.000 na descrição.');record.Descricao=CC.rich(record.Descricao).__safeHtml;for(const [key,value] of f.data){if(key.startsWith('campo_'))record.DadosDinamicos[key.slice(6)]=String(value);const m=key.match(/^Links\[([^\]]+)\]\.Url$/);if(m&&value){if(!CC.url(value))throw new Error('Informe uma URL válida para o projeto.');record.Links.push({Tipo:String(f.data.get('Links['+m[1]+'].Tipo')||'Link'),Url:String(value)});}}
 for(const field of CC.fields.filter(x=>x.AreaId===user.AreaId&&x.Obrigatorio))if(!record.DadosDinamicos[field.Nome])throw new Error('Preencha o campo '+field.Nome+'.');
 for(const [key,file] of f.data)if(file instanceof File&&file.size){record[/pdf/i.test(key)?'ArquivoPdf':'ImagemCapa']=await CC.file(file,/pdf/i.test(key)?'pdf':'image');}
 const saved=CC.change(db=>{if(action.endsWith('Editar')){const p=db.projetos.find(p=>p.Id===id&&p.AlunoId===user.Id);if(!p)throw new Error('Você não pode editar este projeto.');Object.assign(p,record);return p;}return CC.insert(db,'projetos',{...record,AlunoId:user.Id,Ativo:true,DataCriacao:CC.now()});});CC.go('Projeto/Detalhes',{id:saved.Id});};
CC.handlers['Projeto/ConfirmarExcluir']=CC.handlers['Projeto/Excluir']=async f=>{const user=CC.require('Aluno'),id=Number(f.get('id')||CC.query().id);if(!await CC.confirm('Excluir este projeto, comentários e curtidas?'))return;CC.change(db=>{if(!db.projetos.some(p=>p.Id===id&&p.AlunoId===user.Id))throw new Error('Você não pode excluir este projeto.');db.projetos=db.projetos.filter(p=>p.Id!==id);db.comentarios=db.comentarios.filter(c=>c.ProjetoId!==id);db.curtidas=db.curtidas.filter(c=>c.ProjetoId!==id);});CC.go('Aluno/Dashboard');};
CC.handlers['Projeto/Comentar']=async f=>{const user=CC.require(),id=Number(f.get('projetoId')),texto=f.get('texto');if(!texto||texto.length>2000)throw new Error('Escreva um comentário de até 2.000 caracteres.');CC.change(db=>{const p=db.projetos.find(p=>p.Id===id);if(!p)throw new Error('Projeto não encontrado.');CC.insert(db,'comentarios',{ProjetoId:id,Texto:texto,DataComentario:CC.now(),AlunoId:user.Tipo==='Aluno'?user.Id:null,EmpresaId:user.Tipo==='Empresa'?user.Id:null});CC.notice(db,p.AlunoId,'Aluno','Novo comentário',user.Nome||user.RazaoSocial,CC.link('Projeto/Detalhes',{id}));});CC.render();CC.message('Comentário publicado.');};
CC.handlers['Mensagem/Enviar']=async f=>{const user=CC.require(),id=Number(f.get('conversaId')),texto=f.get('texto');if(!texto||texto.length>4000)throw new Error('Escreva uma mensagem de até 4.000 caracteres.');CC.change(db=>{const c=db.conversas.find(c=>c.Id===id&&(user.Tipo==='Empresa'?c.EmpresaId:c.AlunoId)===user.Id);if(!c)throw new Error('Conversa não encontrada.');if(c[user.Tipo==='Empresa'?'ArquivadaPorEmpresa':'ArquivadaPorAluno'])throw new Error('Reabra a conversa antes de enviar.');if(c[user.Tipo==='Empresa'?'ArquivadaPorAluno':'ArquivadaPorEmpresa'])throw new Error('Conversa arquivada pelo destinatário. Aguarde a reabertura.');CC.insert(db,'mensagens',{ConversaId:id,RemetenteTipo:user.Tipo,RemetenteId:user.Id,Texto:texto,DataEnvio:CC.now(),Lida:false});c.UltimaMensagemEm=CC.now();CC.notice(db,user.Tipo==='Empresa'?c.AlunoId:c.EmpresaId,user.Tipo==='Empresa'?'Aluno':'Empresa','Nova mensagem',user.Nome||user.RazaoSocial,CC.link('Mensagem/Sala',{id}));});CC.render();};
for(const [action,type,idField] of [['Avaliacao/AvaliarAluno','Aluno','alunoId'],['Avaliacao/AvaliarEmpresa','Empresa','empresaId']])CC.handlers[action]=async f=>{const user=CC.require(),id=Number(f.get(idField)),nota=Number(f.get('nota'));if(!Number.isInteger(nota)||nota<1||nota>5)throw new Error('Selecione uma nota de 1 a 5 estrelas.');CC.change(db=>{if(!CC.canReview(db,user,id,type))throw new Error('A avaliação exige vínculo de trabalho aprovado. Autoavaliações não são permitidas.');const old=db.avaliacoes.find(a=>a.AvaliadorId===user.Id&&a.TipoAvaliador===user.Tipo&&a.AvaliadoId===id&&a.TipoAvaliado===type);if(old&&Date.now()-new Date(old.DataAvaliacao)<182*86400000)throw new Error('Aguarde 182 dias para avaliar novamente este perfil.');CC.insert(db,'avaliacoes',{AvaliadorId:user.Id,TipoAvaliador:user.Tipo,AvaliadoId:id,TipoAvaliado:type,Nota:nota,Comentario:f.get('comentario'),DataAvaliacao:CC.now()});CC.notice(db,id,type,'Nova avaliação','Você recebeu uma avaliação.',CC.link('Avaliacao/MinhasAvaliacoes'));});CC.go('Avaliacao/AvaliacoesFeitas');};

/* ===== js/payments.js ===== */
/* Checkout inteiramente simulado: não há credenciais nem cobrança. */
CC.activatePayment=function(db,payment){if(payment.Status==='Ativa')return payment;const active=CC.activePlan(db,payment.EmpresaId),start=active?new Date(active.Fim):new Date();payment.Status='Ativa';payment.Inicio=start.toISOString();payment.Fim=new Date(start.getTime()+30*86400000).toISOString();CC.notice(db,payment.EmpresaId,'Empresa','Plano ativado','Pagamento de demonstração aprovado. Validade de 30 dias.',CC.link('Premium/Historico'));return payment;};
CC.handlers['Premium/Assinar']=async f=>{const user=CC.require('Empresa');if(!f.get('confirmarDemo'))throw new Error('Confirme que o pagamento é demonstrativo.');const amount=Number(f.get('valor')),status=f.get('resultado');if(![1,200].includes(amount)||!['Ativa','Pendente','Falha'].includes(status))throw new Error('Selecione uma opção válida.');const payment=CC.change(db=>{const row=CC.insert(db,'assinaturas',{EmpresaId:user.Id,PlanoPremiumId:1,Inicio:CC.now(),Fim:null,Status:status==='Ativa'?'Pendente':status,ValorPago:amount,ModoDemonstracao:true,Metodo:f.get('metodo')});if(status==='Ativa')CC.activatePayment(db,row);return row;});CC.go(status==='Ativa'?'Premium/PagamentoSucesso':status==='Pendente'?'Premium/PagamentoPendente':'Premium/PagamentoFalha',{id:payment.Id});};


/* ===== js/actions.js ===== */
/* Despacho explícito das ações: cada alteração valida a conta e a propriedade. */
CC.runCommand=async function(command,data={}){try{
 if(command==='logout')return CC.logout();
 if(command==='reset'){if(await CC.confirm('Restaurar toda a demonstração? Contas e alterações locais serão apagadas.')){CC.reset();CC.go('Home/Index');}return;}
 if(command==='demo'){const db=CC.db(),user=db[data.type==='Empresa'?'empresas':'alunos'].find(u=>u.Id===Number(data.id||1));if(!user)throw new Error('A conta de demonstração foi removida. Restaure os dados nas configurações.');CC.setSession(user);return CC.go(user.Tipo==='Empresa'?'Empresa/Dashboard':'Aluno/Dashboard');}
 if(command==='checkout')return CC.go('Premium/Pagamento');
 const user=CC.require(),id=Number(data.id);
 if(command==='like'){CC.change(db=>{if(!db.projetos.some(p=>p.Id===id))throw new Error('Projeto não encontrado.');const key=user.Tipo==='Aluno'?'AlunoId':'EmpresaId',old=db.curtidas.find(c=>c.ProjetoId===id&&c[key]===user.Id);if(old)db.curtidas=db.curtidas.filter(c=>c.Id!==old.Id);else CC.insert(db,'curtidas',{ProjetoId:id,[key]:user.Id,DataCurtida:CC.now()});});}
 else if(command==='favorite-job'||command==='favorite-person'){const job=command==='favorite-job';CC.require(job?'Aluno':'Empresa');CC.change(db=>{const table=job?'favoritosVagas':'favoritosTalentos',owner=job?'AlunoId':'EmpresaId',target=job?'OportunidadeId':'AlunoId';if(!db[job?'vagas':'alunos'].some(r=>r.Id===id))throw new Error('Registro não encontrado.');const old=db[table].find(r=>r[owner]===user.Id&&r[target]===id);if(old)db[table]=db[table].filter(r=>r.Id!==old.Id);else CC.insert(db,table,{[owner]:user.Id,[target]:id,CriadoEm:CC.now()});});}
 else if(command==='conversation'){const alunoId=Number(data.aluno|| (user.Tipo==='Aluno'?user.Id:0)),empresaId=Number(data.empresa||(user.Tipo==='Empresa'?user.Id:0));if(user.Tipo==='Empresa')CC.requirePlan();const c=CC.change(db=>{if((user.Tipo==='Aluno'?alunoId:empresaId)!==user.Id)throw new Error('Você só pode iniciar suas próprias conversas.');if(!db.alunos.some(a=>a.Id===alunoId)||!db.empresas.some(e=>e.Id===empresaId))throw new Error('Contato não encontrado.');let c=db.conversas.find(c=>c.AlunoId===alunoId&&c.EmpresaId===empresaId);if(!c)c=CC.insert(db,'conversas',{AlunoId:alunoId,EmpresaId:empresaId,ArquivadaPorAluno:false,ArquivadaPorEmpresa:false,DataCriacao:CC.now(),UltimaMensagemEm:CC.now()});return c;});return CC.go('Mensagem/Sala',{id:c.Id});}
 else if(command==='archive'||command==='reopen'){CC.change(db=>{const c=db.conversas.find(c=>c.Id===id&&(user.Tipo==='Empresa'?c.EmpresaId:c.AlunoId)===user.Id);if(!c)throw new Error('Conversa não encontrada.');c[user.Tipo==='Empresa'?'ArquivadaPorEmpresa':'ArquivadaPorAluno']=command==='archive';});}
 else if(command==='remove-photo'||command==='remove-cv'){if(!await CC.confirm(command==='remove-photo'?'Remover a foto deste perfil?':'Remover seu currículo?'))return;CC.change(db=>{const u=db[user.Tipo==='Empresa'?'empresas':'alunos'].find(u=>u.Id===user.Id);u[command==='remove-cv'?'Curriculo':user.Tipo==='Empresa'?'LogoEmpresa':'FotoPerfil']=null;});}
 else if(command==='tour'){CC.change(db=>{db[user.Tipo==='Empresa'?'empresas':'alunos'].find(u=>u.Id===user.Id).TourInicialConcluido=true;});}
 else if(['read','read-all','clear-notifications'].includes(command)){if(command==='clear-notifications'&&!await CC.confirm('Apagar todas as suas notificações?'))return;CC.change(db=>{const own=n=>n.DestinatarioId===user.Id&&n.TipoDestinatario===user.Tipo;if(command==='clear-notifications')db.notificacoes=db.notificacoes.filter(n=>!own(n));else db.notificacoes.filter(n=>own(n)&&(command==='read-all'||n.Id===id)).forEach(n=>n.Lida=true);});}
 else if(command==='approve-payment'){CC.require('Empresa');CC.change(db=>{const p=db.assinaturas.find(a=>a.Id===id&&a.EmpresaId===user.Id&&a.Status==='Pendente');if(!p)throw new Error('Pagamento pendente não encontrado.');CC.activatePayment(db,p);});return CC.go('Premium/PagamentoSucesso',{id});}
 else throw new Error('Ação não disponível nesta página.');

      if(!response.ok)throw new Error(data.message||data.name||'CNPJ não encontrado na base pública.');
      showSections();
      setValue('inputRazaoSocial',data.razao_social||'');
      setValue('inputNomeFantasia',data.nome_fantasia||'');
      setValue('inputSituacaoCadastral',data.descricao_situacao_cadastral||data.situacao_cadastral||'');
      setValue('inputDataAbertura',formatDate(data.data_inicio_atividade));
      setValue('inputNaturezaJuridica',data.natureza_juridica||data.codigo_natureza_juridica||'');
      setValue('inputEndereco',data.logradouro||'');
      setValue('inputNumero',data.numero||'');
      setValue('inputBairro',data.bairro||'');
      setValue('inputCidade',data.municipio||'');
      setValue('inputEstado',data.uf||'');
      setValue('inputCep',formatCep(data.cep));
      setValue('inputEmail',data.email||'');
      setValue('inputTelefone',formatPhone(data.ddd_telefone_1||data.ddd_telefone_2||''));
      setValue('inputArea',data.cnae_fiscal_descricao||'');
      document.getElementById('cnpjValidado').value='true';
      CC.message('CNPJ encontrado. Os dados da empresa foram preenchidos automaticamente.');
      document.getElementById('secaoDadosEmpresa')?.scrollIntoView({behavior:'smooth',block:'start'});
    }catch(error){
      document.getElementById('cnpjValidado').value='false';
      CC.message((error?.message||'Não foi possível consultar o CNPJ.')+' Você ainda pode usar o botão Manual.',true);
    }finally{
      if(loading){loading.classList.add('d-none');loading.style.display='none';}
      if(button)button.disabled=false;
    }
  });
  document.getElementById('btnProcurarOutro')?.addEventListener('click',()=>{
    const cnpj=document.getElementById('inputCnpj');if(cnpj)cnpj.value='';clearCompanyData();document.getElementById('cnpjValidado').value='false';cnpj?.focus();
  });
